<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rooftop Cricket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EDF6ED;
  --nav: #1B4332;
  --nav-text: rgba(255,255,255,0.65);
  --nav-active: #FBBF24;
  --green: #2D6A4F;
  --green-light: #D8F3DC;
  --amber: #D97706;
  --white: #FFFFFF;
  --text: #18181B;
  --muted: #6B7280;
  --border: #D1E7D5;
  --danger: #B91C1C;
  --radius: 10px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1F14;
    --nav: #0A1810;
    --nav-text: rgba(255,255,255,0.55);
    --green: #52B788;
    --green-light: #1B3A28;
    --white: #1A2E20;
    --text: #E8F5E8;
    --muted: #7DAA88;
    --border: #2A4A32;
  }
}
[data-theme="dark"] {
  --bg: #0D1F14;
  --nav: #0A1810;
  --nav-text: rgba(255,255,255,0.55);
  --green: #52B788;
  --green-light: #1B3A28;
  --white: #1A2E20;
  --text: #E8F5E8;
  --muted: #7DAA88;
  --border: #2A4A32;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}

.header{background:var(--nav);position:sticky;top:0;z-index:100;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:200}
.header-inner{padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.logo-ball{width:22px;height:22px;background:#E53E3E;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.logo-ball svg{width:14px;height:14px;fill:none;stroke:rgba(255,255,255,.6);stroke-width:1.5}
.logo span{color:var(--nav-active)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;margin-left:auto;opacity:0;transition:opacity .3s}
.sync-dot.on{opacity:1}
nav{display:flex;margin-top:12px}
.nav-btn{flex:1;padding:10px 4px;background:none;border:none;color:var(--nav-text);font-family:'Inter',sans-serif;font-size:12px;font-weight:500;cursor:pointer;border-bottom:2.5px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap}
.nav-btn.on{color:var(--nav-active);border-bottom-color:var(--nav-active)}

.main{padding:18px;max-width:640px;margin:0 auto;padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
.page{display:none}.page.on{display:block}

/* Loading */
.loading-bar{height:3px;background:var(--nav);overflow:hidden;position:relative}
.loading-bar::after{content:'';position:absolute;left:-60%;width:60%;height:100%;background:var(--nav-active);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{to{left:110%}}
.loading-msg{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px}
.error-msg{background:#FEF2F2;border:1px solid #FECACA;border-radius:var(--radius);padding:14px 16px;color:#991B1B;font-size:14px;margin-bottom:16px;line-height:1.5}

/* Summary bar */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.sumcard{background:var(--white);border-radius:var(--radius);padding:14px 10px;text-align:center;border:1px solid var(--border)}
.sumcard-val{font-family:'Oswald',sans-serif;font-size:30px;font-weight:700;color:var(--green);line-height:1}
.sumcard-lbl{font-size:11px;color:var(--muted);margin-top:3px;font-weight:500}

.sh{font-family:'Oswald',sans-serif;font-size:17px;font-weight:600;color:var(--text);margin-bottom:14px;letter-spacing:.3px}

/* Player grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-bottom:18px}
.pcard{background:var(--white);border-radius:var(--radius);padding:14px;border:1px solid var(--border);border-left:4px solid var(--pc,var(--green));position:relative}
.pcard-name{font-weight:600;font-size:14px;margin-bottom:10px;padding-right:20px;color:var(--text)}
.prow{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.plbl{font-size:11px;color:var(--muted)}
.pval{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;color:var(--text)}
.pval.hi{color:var(--green)}
.del-btn{position:absolute;top:10px;right:8px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 5px;border-radius:4px;opacity:.45;transition:opacity .15s}
.del-btn:hover{opacity:1;color:var(--danger)}

.empty{text-align:center;padding:36px 16px;color:var(--muted);grid-column:1/-1}
.empty-ico{font-size:40px;margin-bottom:10px;display:block;line-height:1}
.empty p{font-size:14px}

/* Add player */
.add-row{display:flex;gap:8px}
.inp{flex:1;padding:10px 13px;border:1.5px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;background:var(--white);color:var(--text);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--green)}
.btn{padding:10px 18px;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-green{background:var(--green);color:#fff}
.btn-amber{background:var(--amber);color:#fff}
.btn-ghost{background:var(--green-light);color:var(--green);border:1.5px solid var(--border)}

/* Record game */
.card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:16px}
.card-sec{padding:15px;border-bottom:1px solid var(--border)}
.card-sec:last-child{border-bottom:none}
.flabel{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:9px;display:block}
.date-inp{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;background:var(--white);color:var(--text);outline:none}
.date-inp:focus{border-color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 13px;border-radius:20px;border:1.5px solid var(--border);font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);background:var(--bg);transition:all .15s}
.chip.on{border-color:var(--green);background:var(--green-light);color:var(--green)}
.entry-list{display:flex;flex-direction:column;gap:14px}
.entry-player{border:1.5px solid var(--border);border-left:4px solid var(--pc,var(--green));border-radius:8px;padding:13px}
.entry-name{font-weight:600;font-size:14px;margin-bottom:11px;color:var(--text)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sig{display:flex;flex-direction:column;gap:3px}
.sig label{font-size:10px;color:var(--muted);font-weight:500}
.si{padding:7px 6px;border:1.5px solid var(--border);border-radius:6px;font-family:'Oswald',sans-serif;font-size:20px;font-weight:500;width:100%;background:var(--bg);color:var(--text);text-align:center;outline:none}
.si:focus{border-color:var(--green)}
.notout-row{display:flex;align-items:center;gap:7px;margin-top:2px}
.notout-row input{accent-color:var(--green);width:15px;height:15px;cursor:pointer}
.notout-row label{font-size:12px;color:var(--muted);cursor:pointer}
.submit-row{padding:15px;display:flex;gap:8px}

/* Stats table */
.pill-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pill{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);font-size:13px;font-weight:500;cursor:pointer;background:var(--white);color:var(--muted);transition:all .15s}
.pill.on{background:var(--nav);color:#fff;border-color:var(--nav)}
.tbl-wrap{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:11px 12px;text-align:left;font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
thead th:hover{color:var(--text)}
thead th.sa{color:var(--green)}
thead th.sa::after{content:' ↓'}
thead th.sa.asc::after{content:' ↑'}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--green-light)}
.pname-cell{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.n{font-family:'Oswald',sans-serif;font-size:16px;font-weight:500}
.n.top{color:var(--green);font-weight:700}

/* History */
.hlist{display:flex;flex-direction:column;gap:12px}
.hcard{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);padding:15px}
.hcard-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hdate{font-weight:600;font-size:14px;color:var(--text)}
.hdel{background:none;border:none;color:var(--muted);cursor:pointer;font-size:19px;padding:1px 5px;border-radius:4px;opacity:.45;transition:opacity .15s;line-height:1}
.hdel:hover{opacity:1;color:var(--danger)}
.htable{width:100%;border-collapse:collapse;font-size:12px}
.htable th{padding:5px 8px;text-align:left;color:var(--muted);font-size:10px;font-weight:600;border-bottom:1px solid var(--border)}
.htable td{padding:6px 8px;border-bottom:1px solid var(--border)}
.htable tr:last-child td{border-bottom:none}

/* Toast */
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(70px);background:var(--nav);color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.22);opacity:0;transition:transform .28s ease,opacity .28s ease;z-index:300;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:380px){.sgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-ball" aria-hidden="true">
        <svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" stroke="rgba(255,255,255,.5)" stroke-width="1"/><path d="M7 1.5C7 1.5 5 4 5 7s2 5.5 2 5.5" stroke="rgba(255,255,255,.6)"/><path d="M7 1.5C7 1.5 9 4 9 7s-2 5.5-2 5.5" stroke="rgba(255,255,255,.6)"/></svg>
      </div>
      ROOFTOP <span>CRICKET</span>
    </div>
    <div class="sync-dot" id="sync-dot" title="Connected"></div>
  </div>
  <nav role="tablist">
    <button class="nav-btn on" onclick="go('scoreboard')" role="tab">Scoreboard</button>
    <button class="nav-btn" onclick="go('record')" role="tab">Record Game</button>
    <button class="nav-btn" onclick="go('stats')" role="tab">Stats</button>
    <button class="nav-btn" onclick="go('history')" role="tab">History</button>
  </nav>
</header>

<div class="loading-bar" id="loading-bar"></div>

<main class="main">

  <!-- SCOREBOARD -->
  <section id="pg-scoreboard" class="page on">
    <div id="sb-loading" class="loading-msg">Loading stats…</div>
    <div id="sb-content" style="display:none">
      <div class="summary" id="summary"></div>
      <div class="sh">Players</div>
      <div class="pgrid" id="pgrid"></div>
      <div class="add-row">
        <input class="inp" id="np" placeholder="Add a player…" maxlength="28" onkeydown="if(event.key==='Enter')addPlayer()">
        <button class="btn btn-amber" id="add-btn" onclick="addPlayer()">Add</button>
      </div>
    </div>
  </section>

  <!-- RECORD GAME -->
  <section id="pg-record" class="page">
    <div class="sh">Record a Game</div>
    <div class="card">
      <div class="card-sec">
        <label class="flabel">Date</label>
        <input type="date" class="date-inp" id="gdate">
      </div>
      <div class="card-sec">
        <label class="flabel">Who played?</label>
        <div class="chips" id="chips"></div>
      </div>
      <div class="card-sec" id="entry-sec" style="display:none">
        <label class="flabel">Enter stats</label>
        <div class="entry-list" id="entry-list"></div>
      </div>
      <div class="submit-row">
        <button class="btn btn-green" style="flex:1" id="save-btn" onclick="saveGame()">Save Game</button>
        <button class="btn btn-ghost" onclick="resetForm()">Clear</button>
      </div>
    </div>
  </section>

  <!-- STATS -->
  <section id="pg-stats" class="page">
    <div class="sh">Statistics</div>
    <div class="pill-row">
      <button class="pill on" onclick="setView('bat')">Batting</button>
      <button class="pill" onclick="setView('bowl')">Bowling</button>
      <button class="pill" onclick="setView('field')">Fielding</button>
    </div>
    <div class="tbl-wrap">
      <table><thead id="lhd"></thead><tbody id="lbd"></tbody></table>
    </div>
  </section>

  <!-- HISTORY -->
  <section id="pg-history" class="page">
    <div class="sh">Match History</div>
    <div class="hlist" id="hlist"></div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
const COLORS=['#2D6A4F','#1565C0','#7B1FA2','#E65100','#00695C','#AD1457','#4527A0','#0277BD','#558B2F','#6D4C41'];

let S={players:[],games:[]};
let sel=new Set();
let view='bat';
let sc=null,sa=false;
let curPage='scoreboard';
let dbRef=null;
let ready=false;
let playersOk=false,gamesOk=false;
let loadTimer=null;

function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function color(i){return COLORS[i%COLORS.length]}
function pById(id){return S.players.find(p=>p.id===id)}
function pIdx(id){return S.players.findIndex(p=>p.id===id)}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),2500);
}

function setLoading(on){
  document.getElementById('loading-bar').style.display=on?'block':'none';
}

function showReady(){
  clearTimeout(loadTimer);
  ready=true;
  setLoading(false);
  document.getElementById('sync-dot').classList.add('on');
  document.getElementById('sb-loading').style.display='none';
  document.getElementById('sb-content').style.display='block';
  renderCurrent();
}

function showError(msg){
  setLoading(false);
  document.getElementById('sb-loading').style.display='none';
  document.getElementById('sb-content').innerHTML=`<div class="error-msg">${esc(msg)}</div>`;
  document.getElementById('sb-content').style.display='block';
}

function checkReady(){
  if(playersOk&&gamesOk&&!ready)showReady();
  else if(ready)renderCurrent();
}

function renderCurrent(){
  if(curPage==='scoreboard')renderScoreboard();
  else if(curPage==='record')renderChips();
  else if(curPage==='stats')renderStats();
  else if(curPage==='history')renderHistory();
}

function go(pg){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('pg-'+pg).classList.add('on');
  const tabs=['scoreboard','record','stats','history'];
  document.querySelectorAll('.nav-btn')[tabs.indexOf(pg)]?.classList.add('on');
  curPage=pg;
  if(ready)renderCurrent();
}

/* ---- COMPUTED STATS ---- */
function stats(pid){
  const es=S.games.flatMap(g=>(g.innings||[]).filter(i=>i.playerId===pid));
  const m=es.length;
  const runs=es.reduce((s,e)=>s+(e.runs||0),0);
  const no=es.filter(e=>e.notOut).length;
  const dis=m-no;
  const hs=m?Math.max(...es.map(e=>e.runs||0)):0;
  const hsno=es.some(e=>(e.runs||0)===hs&&e.notOut);
  const avg=dis>0?runs/dis:(runs>0?runs:null);
  const fours=es.reduce((s,e)=>s+(e.fours||0),0);
  const sixes=es.reduce((s,e)=>s+(e.sixes||0),0);
  const wkts=es.reduce((s,e)=>s+(e.wickets||0),0);
  const overs=es.reduce((s,e)=>s+(e.overs||0),0);
  const rc=es.reduce((s,e)=>s+(e.runsConceded||0),0);
  const econ=overs>0?rc/overs:null;
  const catches=es.reduce((s,e)=>s+(e.catches||0),0);
  const ros=es.reduce((s,e)=>s+(e.runOuts||0),0);
  return{m,runs,no,dis,hs,hsno,avg,fours,sixes,wkts,overs,rc,econ,catches,ros};
}

/* ---- SCOREBOARD ---- */
function renderScoreboard(){
  const totalGames=S.games.length;
  const totalPlayers=S.players.length;
  const totalRuns=S.games.flatMap(g=>g.innings||[]).reduce((s,e)=>s+(e.runs||0),0);
  document.getElementById('summary').innerHTML=`
    <div class="sumcard"><div class="sumcard-val">${totalPlayers}</div><div class="sumcard-lbl">Players</div></div>
    <div class="sumcard"><div class="sumcard-val">${totalGames}</div><div class="sumcard-lbl">Games</div></div>
    <div class="sumcard"><div class="sumcard-val">${totalRuns}</div><div class="sumcard-lbl">Total runs</div></div>
  `;
  const g=document.getElementById('pgrid');
  if(!S.players.length){
    g.innerHTML=`<div class="empty"><span class="empty-ico">🏏</span><p>Add some players below to get started.</p></div>`;
    return;
  }
  g.innerHTML=S.players.map((p,i)=>{
    const s=stats(p.id);
    const c=color(i);
    return `<div class="pcard" style="--pc:${c}">
      <button class="del-btn" onclick="delPlayer('${p.id}')" title="Remove">×</button>
      <div class="pcard-name">${esc(p.name)}</div>
      <div class="prow"><span class="plbl">Matches</span><span class="pval">${s.m}</span></div>
      <div class="prow"><span class="plbl">Runs</span><span class="pval hi">${s.runs}</span></div>
      <div class="prow"><span class="plbl">High score</span><span class="pval">${s.hs}${s.hsno&&s.m?'*':''}</span></div>
      <div class="prow"><span class="plbl">Wickets</span><span class="pval">${s.wkts}</span></div>
    </div>`;
  }).join('');
}

async function addPlayer(){
  if(!dbRef){toast('Not connected yet — try again shortly.');return;}
  const inp=document.getElementById('np');
  const name=inp.value.trim();
  if(!name)return;
  if(S.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){toast('Player already exists.');return;}
  const btn=document.getElementById('add-btn');
  btn.disabled=true;
  try{
    const id=uid();
    await dbRef.collection('players').doc(id).set({name,createdAt:Date.now()});
    inp.value='';
    toast(`${name} added!`);
  }catch(e){toast('Could not add player: '+e.message);}
  btn.disabled=false;
}

async function delPlayer(id){
  if(!dbRef)return;
  const p=pById(id);if(!p)return;
  if(!confirm(`Remove ${p.name}? Their records will also be removed.`))return;
  try{
    await dbRef.collection('players').doc(id).delete();
    for(const g of S.games){
      const newInnings=(g.innings||[]).filter(i=>i.playerId!==id);
      if(newInnings.length===0){
        await dbRef.collection('games').doc(g.id).delete();
      }else if(newInnings.length!==(g.innings||[]).length){
        await dbRef.collection('games').doc(g.id).set({...g,innings:newInnings});
      }
    }
    sel.delete(id);
    toast('Player removed.');
  }catch(e){toast('Error removing player: '+e.message);}
}

/* ---- RECORD GAME ---- */
function renderChips(){
  const el=document.getElementById('chips');
  if(!S.players.length){
    el.innerHTML='<p style="font-size:13px;color:var(--muted)">Add players on the Scoreboard first.</p>';
    return;
  }
  // Remove stale selections
  sel.forEach(id=>{if(!pById(id))sel.delete(id);});
  el.innerHTML=S.players.map(p=>`
    <button class="chip${sel.has(p.id)?' on':''}" onclick="toggleChip('${p.id}')">${esc(p.name)}</button>
  `).join('');
  renderEntries();
}

function toggleChip(id){
  sel.has(id)?sel.delete(id):sel.add(id);
  renderChips();
}

function renderEntries(){
  const sec=document.getElementById('entry-sec');
  const list=document.getElementById('entry-list');
  if(!sel.size){sec.style.display='none';return;}
  sec.style.display='block';
  // Only add new player blocks; preserve existing ones
  const existing=new Set([...list.querySelectorAll('.entry-player')].map(el=>el.dataset.pid));
  const toAdd=[...sel].filter(id=>!existing.has(id));
  const toRemove=[...existing].filter(id=>!sel.has(id));
  toRemove.forEach(id=>{
    const el=list.querySelector(`.entry-player[data-pid="${id}"]`);
    if(el)el.remove();
  });
  toAdd.forEach(id=>{
    const p=pById(id);if(!p)return;
    const c=color(pIdx(id));
    const div=document.createElement('div');
    div.className='entry-player';
    div.dataset.pid=id;
    div.style.setProperty('--pc',c);
    div.innerHTML=`<div class="entry-name">${esc(p.name)}</div>
      <div class="sgrid">
        <div class="sig"><label>Runs</label><input type="number" class="si" id="s-${id}-runs" min="0" value="0"></div>
        <div class="sig"><label>Fours (4s)</label><input type="number" class="si" id="s-${id}-fours" min="0" value="0"></div>
        <div class="sig"><label>Sixes (6s)</label><input type="number" class="si" id="s-${id}-sixes" min="0" value="0"></div>
        <div class="sig"><label>Wickets</label><input type="number" class="si" id="s-${id}-wkts" min="0" value="0"></div>
        <div class="sig"><label>Overs bowled</label><input type="number" class="si" id="s-${id}-overs" min="0" step="0.1" value="0"></div>
        <div class="sig"><label>Runs conceded</label><input type="number" class="si" id="s-${id}-rc" min="0" value="0"></div>
        <div class="sig"><label>Catches</label><input type="number" class="si" id="s-${id}-ctch" min="0" value="0"></div>
        <div class="sig"><label>Run outs</label><input type="number" class="si" id="s-${id}-ros" min="0" value="0"></div>
        <div class="sig" style="justify-content:flex-end">
          <div class="notout-row"><input type="checkbox" id="s-${id}-no"><label for="s-${id}-no">Not out</label></div>
        </div>
      </div>`;
    list.appendChild(div);
  });
}

function gv(id,fl=false){
  const el=document.getElementById(id);if(!el)return 0;
  const v=fl?parseFloat(el.value):parseInt(el.value,10);
  return isNaN(v)?0:Math.max(0,v);
}

async function saveGame(){
  if(!dbRef){toast('Not connected yet — try again shortly.');return;}
  if(!sel.size){toast('Select at least one player.');return;}
  const date=document.getElementById('gdate').value||new Date().toISOString().split('T')[0];
  const innings=[...sel].map(id=>({
    playerId:id,
    runs:gv(`s-${id}-runs`),fours:gv(`s-${id}-fours`),sixes:gv(`s-${id}-sixes`),
    wickets:gv(`s-${id}-wkts`),overs:gv(`s-${id}-overs`,true),runsConceded:gv(`s-${id}-rc`),
    catches:gv(`s-${id}-ctch`),runOuts:gv(`s-${id}-ros`),
    notOut:!!document.getElementById(`s-${id}-no`)?.checked
  }));
  const btn=document.getElementById('save-btn');
  btn.disabled=true;
  try{
    await dbRef.collection('games').add({date,innings,createdAt:Date.now()});
    resetForm();
    toast('Game saved! 🏏');
    go('scoreboard');
  }catch(e){toast('Could not save game: '+e.message);}
  btn.disabled=false;
}

function resetForm(){
  sel.clear();
  document.getElementById('gdate').value=new Date().toISOString().split('T')[0];
  document.getElementById('entry-list').innerHTML='';
  document.getElementById('entry-sec').style.display='none';
  renderChips();
}

/* ---- STATS TABLE ---- */
function setView(v){
  view=v;sc=null;
  document.querySelectorAll('.pill').forEach((p,i)=>p.classList.toggle('on',['bat','bowl','field'][i]===v));
  renderStats();
}

function renderStats(){
  if(!S.players.length){
    document.getElementById('lhd').innerHTML='';
    document.getElementById('lbd').innerHTML='<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted)">No players yet.</td></tr>';
    return;
  }
  const all=S.players.map((p,i)=>({...stats(p.id),name:p.name,id:p.id,c:color(i)}));
  let cols,rows;
  if(view==='bat'){
    cols=[{k:'name',l:'Player'},{k:'m',l:'M'},{k:'runs',l:'Runs'},{k:'hs',l:'HS'},{k:'avg',l:'Avg'},{k:'fours',l:'4s'},{k:'sixes',l:'6s'}];
    const sorted=sortRows([...all],'runs');
    const topR=Math.max(...sorted.map(s=>s.runs),0);
    rows=sorted.map(s=>`<tr>
      <td><div class="pname-cell"><div class="dot" style="background:${s.c}"></div>${esc(s.name)}</div></td>
      <td><span class="n">${s.m}</span></td>
      <td><span class="n${s.runs===topR&&topR>0?' top':''}">${s.runs}</span></td>
      <td><span class="n">${s.hs}${s.hsno&&s.m?'*':''}</span></td>
      <td><span class="n">${s.avg!==null?s.avg.toFixed(1):'–'}</span></td>
      <td><span class="n">${s.fours}</span></td>
      <td><span class="n">${s.sixes}</span></td>
    </tr>`);
  }else if(view==='bowl'){
    cols=[{k:'name',l:'Player'},{k:'m',l:'M'},{k:'wkts',l:'Wkts'},{k:'overs',l:'Overs'},{k:'rc',l:'Runs'},{k:'econ',l:'Econ'}];
    const sorted=sortRows([...all],'wkts');
    const topW=Math.max(...sorted.map(s=>s.wkts),0);
    rows=sorted.map(s=>`<tr>
      <td><div class="pname-cell"><div class="dot" style="background:${s.c}"></div>${esc(s.name)}</div></td>
      <td><span class="n">${s.m}</span></td>
      <td><span class="n${s.wkts===topW&&topW>0?' top':''}">${s.wkts}</span></td>
      <td><span class="n">${s.overs}</span></td>
      <td><span class="n">${s.rc}</span></td>
      <td><span class="n">${s.econ!==null?s.econ.toFixed(1):'–'}</span></td>
    </tr>`);
  }else{
    cols=[{k:'name',l:'Player'},{k:'m',l:'M'},{k:'catches',l:'Catches'},{k:'ros',l:'Run outs'}];
    const sorted=sortRows([...all],'catches');
    const topC=Math.max(...sorted.map(s=>s.catches),0);
    rows=sorted.map(s=>`<tr>
      <td><div class="pname-cell"><div class="dot" style="background:${s.c}"></div>${esc(s.name)}</div></td>
      <td><span class="n">${s.m}</span></td>
      <td><span class="n${s.catches===topC&&topC>0?' top':''}">${s.catches}</span></td>
      <td><span class="n">${s.ros}</span></td>
    </tr>`);
  }
  document.getElementById('lhd').innerHTML='<tr>'+cols.map(c=>`<th class="${sc===c.k?'sa'+(sa?' asc':''):''}" onclick="sortBy('${c.k}')">${c.l}</th>`).join('')+'</tr>';
  document.getElementById('lbd').innerHTML=rows.join('')||`<tr><td colspan="${cols.length}" style="text-align:center;padding:30px;color:var(--muted)">No games recorded yet.</td></tr>`;
}

function sortRows(rows,def){
  const key=sc||def;
  return rows.sort((a,b)=>{
    const av=a[key]??-Infinity,bv=b[key]??-Infinity;
    if(typeof av==='string')return sa?av.localeCompare(bv):bv.localeCompare(av);
    return sa?av-bv:bv-av;
  });
}
function sortBy(k){if(sc===k)sa=!sa;else{sc=k;sa=false;}renderStats();}

/* ---- HISTORY ---- */
function renderHistory(){
  const el=document.getElementById('hlist');
  if(!S.games.length){
    el.innerHTML=`<div class="empty"><span class="empty-ico">📋</span><p>No games recorded yet.</p></div>`;
    return;
  }
  const sorted=[...S.games].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  el.innerHTML=sorted.map(g=>{
    const d=g.date?new Date(g.date+'T00:00:00').toLocaleDateString('en-AU',{weekday:'short',year:'numeric',month:'short',day:'numeric'}):'Unknown date';
    const rows=(g.innings||[]).map(inn=>{
      const p=pById(inn.playerId);if(!p)return'';
      return`<tr><td>${esc(p.name)}</td><td><strong>${inn.runs}${inn.notOut?'*':''}</strong></td><td>${inn.fours}</td><td>${inn.sixes}</td><td>${inn.wickets}</td><td>${inn.overs}</td><td>${inn.catches}</td></tr>`;
    }).filter(Boolean).join('');
    if(!rows)return'';
    return`<div class="hcard">
      <div class="hcard-hd"><div class="hdate">${d}</div><button class="hdel" onclick="delGame('${g.id}')">×</button></div>
      <table class="htable">
        <thead><tr><th>Player</th><th>Runs</th><th>4s</th><th>6s</th><th>Wkts</th><th>Ovrs</th><th>Cts</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).filter(Boolean).join('');
  if(!el.innerHTML.trim())el.innerHTML=`<div class="empty"><p>No games to show.</p></div>`;
}

async function delGame(id){
  if(!dbRef)return;
  if(!confirm('Delete this game?'))return;
  try{
    await dbRef.collection('games').doc(id).delete();
    toast('Game deleted.');
  }catch(e){toast('Error: '+e.message);}
}

/* ---- INIT ---- */
async function init(){
  document.getElementById('gdate').value=new Date().toISOString().split('T')[0];
  setLoading(true);

  const db=await claude.use('db');
  if(!db){
    showError('Sign in to claude.ai to access the shared stats.');
    return;
  }
  dbRef=db;

  loadTimer=setTimeout(()=>{
    if(!ready)showError("Couldn't reach the shared database. Check your connection and reload.");
  },10000);

  db.collection('players').orderBy('createdAt','asc').onSnapshot(snap=>{
    S.players=snap.docs.map(d=>({id:d.id,...d.data()}));
    playersOk=true;
    checkReady();
  },err=>{
    clearTimeout(loadTimer);
    showError('Error loading players: '+err.message);
  });

  db.collection('games').orderBy('createdAt','asc').onSnapshot(snap=>{
    S.games=snap.docs.map(d=>({id:d.id,...d.data()}));
    gamesOk=true;
    checkReady();
  },err=>{
    clearTimeout(loadTimer);
    showError('Error loading games: '+err.message);
  });
}

init();
</script>
